<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Post</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="main-wrapper">
        <div class="main-container">
            <section class="feed-section">
                <h1>Create New Post</h1>
                <form id="postForm" class="newsletter-form">
                    <input id="title" placeholder="Post title" required>
                    <textarea id="excerpt" placeholder="Post excerpt" required></textarea>
                    <textarea id="content" placeholder="Full content" required></textarea>
                    <button type="submit" class="subscribe-btn">Publish</button>
                </form>
            </section>
        </div>
    </main>

    <script src="../js/posts.js"></script>
    <script>
        document.getElementById("postForm").addEventListener("submit", e => {
            e.preventDefault();
            savePost(title.value, excerpt.value, content.value);
            window.location.href = "../index.html";
        });
    </script>
</body>
</html>
